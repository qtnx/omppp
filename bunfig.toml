telemetry = false

[install]
minimumReleaseAge = 259200 # 3 days in seconds
# `brace-expansion` is pinned by a security override (GHSA-mh99-v99m-4gvg); its
# fix landed inside the 3-day window, so it is exempt from the age gate.
minimumReleaseAgeExcludes = ["@types/bun", "bun-types", "brace-expansion"]
linker = "hoisted"
exact = true
saveTextLockfile = true

[loader]
".md" = "text"
".py" = "text"
".lark" = "text"

[test]
# bun test does NOT honor .gitignore; prune robomp's repo clones and
# scratch dirs so a root-level `bun test` doesn't walk into them.
pathIgnorePatterns = [
  "**/node_modules/**",
  "**/.git/**",
  "**/target/**",
  "**/dist/**",
  "python/**",
  "docs/**",
  "runs/**",
  "python/robomp/data/**",
  ".wt/**",
  ".worktrees/**",
]

[run]
bun = true
