   security:
      needs: [release_metadata]
      if: ${{ needs.release_metadata.outputs.is-companion != 'true' && (needs.release_metadata.outputs.is-release == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
      uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2" # v2.3.8
      permissions:
         actions: read
         contents: read
         security-events: write
      with:
         fail-on-vuln: true
         scan-args: |-
            --config=./osv-scanner.toml
            --lockfile=./bun.lock
            --lockfile=./Cargo.lock

   # Aggregates every release validation job so publishing waits for the
   # complete fork test matrix, security scan, and generated-config check.
   release_gate:
      name: Release validation gate
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.native_linux_x64.result == 'success' &&
         needs.native_linux_x64_modern.result == 'success' &&
         needs.native_cross_platform_kata.result == 'success' &&
         needs.native_cross_platform_win32.result == 'success' &&
         needs.native_cross_platform_macos.result == 'success' &&
         (needs.release_base.outputs.tested == 'true' || (
            needs.test_workspace.result == 'success' &&
            needs.test_coding_agent_singleton.result == 'success' &&
            needs.test_ts_native.result == 'success' &&
            needs.test_coding_agent_ui.result == 'success' &&
            needs.test_coding_agent_runtime.result == 'success' &&
            needs.test_coding_agent_native.result == 'success' &&
            needs.test_smoke.result == 'success' &&
            needs.install_methods.result == 'success')) &&
         (needs.check.result == 'success' || needs.check.result == 'skipped') &&
         needs.security.result == 'success' }}
      needs: [release_metadata, release_base, check, native_linux_x64, native_linux_x64_modern, native_cross_platform_kata, native_cross_platform_win32, native_cross_platform_macos, test_workspace, test_coding_agent_singleton, test_ts_native, test_coding_agent_ui, test_coding_agent_runtime, test_coding_agent_native, test_smoke, install_methods, security, native_artifact_lookup]
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         # Generated-config drift gate: bazel/clippy.bazelrc is maintained by
         # scripts/release.ts (like the lockfiles); a stale file only blocks
         # publishing, never ordinary CI.
         - name: Check generated clippy config
           run: bun scripts/gen-clippy-bazelrc.ts --check
         - run: echo "release validation green"

   release_binary:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.native_linux_x64.result == 'success' &&
         needs.native_linux_x64_modern.result == 'success' &&
         needs.native_cross_platform_kata.result == 'success' &&
         needs.native_cross_platform_win32.result == 'success' &&
         needs.native_cross_platform_macos.result == 'success' &&
         (needs.release_base.outputs.tested == 'true' || (
            needs.test_workspace.result == 'success' &&
            needs.test_coding_agent_singleton.result == 'success' &&
            needs.test_ts_native.result == 'success' &&
            needs.test_coding_agent_ui.result == 'success' &&
            needs.test_coding_agent_runtime.result == 'success' &&
            needs.test_coding_agent_native.result == 'success' &&
            needs.test_smoke.result == 'success' &&
            needs.install_methods.result == 'success')) &&
         (needs.check.result == 'success' || needs.check.result == 'skipped') &&
         needs.security.result == 'success' }}
      needs: [release_metadata, release_base, check, native_linux_x64, native_linux_x64_modern, native_cross_platform_kata, native_cross_platform_win32, native_cross_platform_macos, test_workspace, test_coding_agent_singleton, test_ts_native, test_coding_agent_ui, test_coding_agent_runtime, test_coding_agent_native, test_smoke, install_methods, security, native_artifact_lookup]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    arch: x64,
                    target_id: linux-x64,
                    binary_path: packages/coding-agent/binaries/ompx-linux-x64,
                    native_artifact_pattern: pi-natives-linux-x64-*,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    libc: musl,
                    arch: x64,
                    target_id: linux-musl-x64,
                    binary_path: packages/coding-agent/binaries/ompx-linux-musl-x64,
                    native_artifact_pattern: pi-natives-linux-musl-x64-*,
                 }
               - {
                    os: macos-15-intel,
                    platform: darwin,
                    arch: x64,
                    target_id: darwin-x64,
                    binary_path: packages/coding-agent/binaries/ompx-darwin-x64,
                    native_artifact_pattern: pi-natives-darwin-x64*,
                 }
               - {
                    os: macos-14,
                    platform: darwin,
                    arch: arm64,
                    target_id: darwin-arm64,
                    binary_path: packages/coding-agent/binaries/ompx-darwin-arm64,
                    native_artifact_pattern: pi-natives-darwin-arm64*,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: win32,
                    arch: x64,
                    target_id: win32-x64,
                    binary_path: packages/coding-agent/binaries/ompx-windows-x64.exe,
                    native_artifact_pattern: pi-natives-win32-x64*,
                 }
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
         id-token: write
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
         # Fork guardrail (mirrors release_native_leaf_npm's HAS_NPM_TOKEN):
         # forks without NPM_TOKEN skip the npm leaf publish instead of failing
         # the whole release binary job with npm ENEEDAUTH.
         HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
           env:
              SCCACHE_BUCKET: ""
              AWS_ACCESS_KEY_ID: ""
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         # npm runs under Bun when invoked by the release script; npm 12
         # requires a newer emulated Node version than Bun 1.3 provides.
         - name: Ensure npm supports trusted publishing
           if: ${{ !inputs.skip_npm && env.HAS_NPM_TOKEN == 'true' }}
           run: npm install -g npm@11.17.0
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Download native addon(s)
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: ${{ matrix.native_artifact_pattern }}-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              merge-multiple: true
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Sign and notarize macOS binary (Developer ID)
           # Replaces the ad-hoc signature with a Developer ID + hardened-runtime
           # one (+JIT/library-validation entitlements; omp dlopens its
           # runtime-extracted native addon, which has a different Team ID) and
           # notarizes. Auto-skips until the APPLE_* secrets are configured.
           if: matrix.platform == 'darwin' && env.MACOS_SIGNING == 'true'
           env:
              APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
              APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
              APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
              APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
           run: bash scripts/ci-macos-sign.sh "${{ matrix.binary_path }}"
         # Windows binary is cross-built on Linux, so we have no Windows runner
         # to smoke it on. Cross-build correctness is verified via the napi
         # entry-point exports (see build-native action) and the bun
         # `--compile --target=bun-windows-x64-*` cross-compile. Musl binaries
         # need the musl loader, which glibc runners lack — they are smoked in
         # the Alpine container step below instead.
         - name: Smoke release binary
           if: matrix.platform != 'win32' && matrix.libc != 'musl'
           env:
              RELEASE_TAG: ${{ needs.release_metadata.outputs.release-tag }}
           run: |
              runtime_dir="$(mktemp -d)"
              export HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg"
              # The shipped binary bakes its version from package.json at build time
              # (pi-utils VERSION). It MUST equal the release tag, or `ompx update`
              # compares the wrong number and `ompx --version` reports a stale value.
              # A tag cut without the matching version bump (i.e. not via
              # scripts/release.ts) is exactly the drift this guard rejects.
              reported="$("${{ matrix.binary_path }}" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
              expected="${RELEASE_TAG#v}"
              echo "binary reports '${reported}'; release tag '${RELEASE_TAG}' expects version '${expected}'"
              if [ "$reported" != "$expected" ]; then
                echo "::error::Release binary version (${reported}) != release tag (${expected}). Cut releases with scripts/release.ts so package.json and the git tag stay in sync." >&2
                exit 1
              fi
              "${{ matrix.binary_path }}" --smoke-test
         - name: Smoke musl release binary on Alpine
           if: matrix.libc == 'musl'
           run: |
              binary="$(realpath "${{ matrix.binary_path }}")"
              # Bun's musl-target binaries link libstdc++/libgcc dynamically;
              # Alpine users install them alongside the binary (same as bun itself).
              docker run --rm -v "$binary:/usr/local/bin/ompx:ro" alpine:3.22 sh -ec '
                apk add --no-cache libstdc++ libgcc >/dev/null
                runtime_dir="$(mktemp -d)"
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ompx --version
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ompx --smoke-test
              '
         - name: Publish native addon package
           if: ${{ !inputs.skip_npm && env.HAS_NPM_TOKEN == 'true' && matrix.libc != 'musl' }}
           env:
              # Fallback auth: setup-node wrote an .npmrc referencing
              # NODE_AUTH_TOKEN; npm uses it only when OIDC has no trusted
              # publisher for the package (or on a first publish).
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
           run: bun run ci:release:publish-native-leaf ${{ matrix.target_id }}
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: ompx-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}

   release_github:
      name: Publish GitHub release
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_gate.result == 'success' &&
         needs.release_binary.result == 'success' }}
      needs: [release_metadata, release_gate, release_binary]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Generate release notes from CHANGELOGs
           env:
              # `gh release list` (used to find the latest published GitHub
              # Release tag below the target so silent-tag changelog sections
              # roll forward — #2596) requires GH_TOKEN in Actions. Without
              # it gh exits non-zero and the script would degrade to legacy
              # single-version notes, defeating the recovery.
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: bun scripts/ci-release-notes.ts ${{ needs.release_metadata.outputs.release-tag }}
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: ompx-binary-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         # Dependency-free build (bun APIs + zip only), so no `bun install`
         # is needed on this runner.
         - name: Build browser relay artifacts
           run: |
              bun run --cwd packages/browser-relay build
              mv packages/browser-relay/dist/omp-browser-relay-extension.zip packages/browser-relay/dist/ompx-browser-relay-extension.zip
         - name: Generate release checksums
           working-directory: packages/coding-agent/binaries
           run: sha256sum ompx-* > SHA256SUMS
         # SHA256SUMS.txt covers every uploaded release asset, while the
         # in-directory SHA256SUMS keeps the per-binary checksum asset.
         - name: Generate release asset checksums
           run: |
              bun run ci:release:checksums SHA256SUMS.txt \
                packages/coding-agent/binaries/ompx-* \
                packages/browser-relay/dist/ompx-browser-relay-extension.zip \
                LICENSE \
                THIRD-PARTY-NOTICES.txt
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
              tag_name: ${{ needs.release_metadata.outputs.release-tag }}
              prerelease: ${{ needs.release_metadata.outputs.channel == 'canary' }}
              files: |
                 packages/coding-agent/binaries/ompx-*
                 packages/coding-agent/binaries/SHA256SUMS
                 packages/browser-relay/dist/ompx-browser-relay-extension.zip
                 LICENSE
                 THIRD-PARTY-NOTICES.txt
                 SHA256SUMS.txt
              body_path: release-notes.md
              generate_release_notes: true
              draft: true


   release-native-leaf-npm:
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github.result == 'success' &&
         !inputs.skip_npm }}
      needs: [release_metadata, release_github, native_artifact_lookup]
      strategy:
         fail-fast: false
         matrix:
            include:
               - { platform: linux, arch: x64, target_id: linux-x64 }
               - { platform: darwin, arch: x64, target_id: darwin-x64 }
               - { platform: darwin, arch: arm64, target_id: darwin-arm64 }
               - { platform: win32, arch: x64, target_id: win32-x64 }
      runs-on: ubuntu-22.04
      permissions:
         id-token: write
         contents: read
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
         # No-op without npm credentials (mirrors release_brew's HAS_TAP_KEY):
         # forks without NPM_TOKEN still get GitHub releases — the npm jobs
         # succeed as no-ops so release-github-publish can un-draft the release.
         HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      steps:
         - uses: actions/checkout@v4
           if: env.HAS_NPM_TOKEN == 'true'
         - uses: oven-sh/setup-bun@v2
           if: env.HAS_NPM_TOKEN == 'true'
           with:
              bun-version: "1.4"
         - uses: actions/setup-node@v4
           if: env.HAS_NPM_TOKEN == 'true'
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         - name: Ensure npm supports trusted publishing
           if: env.HAS_NPM_TOKEN == 'true'
           run: npm install -g npm@11.17.0
         - name: Cache bun dependencies
           if: env.HAS_NPM_TOKEN == 'true'
           uses: actions/cache@v4
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
           if: env.HAS_NPM_TOKEN == 'true'
         - name: Download native addon(s)
           if: env.HAS_NPM_TOKEN == 'true'
           uses: actions/download-artifact@v4
           with:
              pattern: pi-natives-${{ matrix.platform }}-${{ matrix.arch }}*-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              merge-multiple: true
         - name: Publish native addon package
           if: env.HAS_NPM_TOKEN == 'true'
           env:
              # Fallback auth: setup-node wrote an .npmrc referencing
              # NODE_AUTH_TOKEN; npm uses it only when OIDC has no trusted
              # publisher for the package (or on a first publish).
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
           run: bun run ci:release:publish-native-leaf ${{ matrix.target_id }}

   release_npm:
      name: Publish to npm
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_binary.result == 'success' &&
         needs.release_github.result == 'success' &&
         needs['release-native-leaf-npm'].result == 'success' &&
         !inputs.skip_npm }}
      needs: [release_metadata, release_binary, release_github, native_artifact_lookup, release-native-leaf-npm]
      runs-on: ubuntu-22.04
      # `id-token: write` lets npm mint the GitHub OIDC token it exchanges for a
      # short-lived publish token (trusted publishing + provenance). When a
      # package has no matching trusted publisher configured, npm silently falls
      # back to NODE_AUTH_TOKEN below — which also covers first-ever publishes.
      permissions:
         id-token: write
         contents: read
      env:
         # Same fork no-op guard as release-native-leaf-npm above.
         HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           if: env.HAS_NPM_TOKEN == 'true'
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           if: env.HAS_NPM_TOKEN == 'true'
           with:
              bun-version: "1.4"
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           if: env.HAS_NPM_TOKEN == 'true'
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         # npm runs under Bun when invoked by the release script; npm 12
         # requires a newer emulated Node version than Bun 1.3 provides.
         - name: Ensure npm supports trusted publishing
           if: env.HAS_NPM_TOKEN == 'true'
           run: npm install -g npm@11.17.0
         - name: Cache bun dependencies
           if: env.HAS_NPM_TOKEN == 'true'
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
           if: env.HAS_NPM_TOKEN == 'true'
         # The pi-coding-agent prepack executes workspace code (bundle-dist
         # imports the pi-utils barrel, which loads the pi-natives addon), so
         # this job needs the linux x64 native addons just like `test` does.
         # Release runs always rebuild natives in this same run, so the
         # default run-id resolves the artifacts.
         - name: Download native addons
           if: env.HAS_NPM_TOKEN == 'true'
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: pi-natives-linux-x64-*-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              merge-multiple: true
         - name: Publish to npm
           if: env.HAS_NPM_TOKEN == 'true'
           env:
              # Fallback auth: setup-node wrote an .npmrc referencing
              # NODE_AUTH_TOKEN; npm uses it only when OIDC has no trusted
              # publisher for the package (or on a first publish).
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
           run: bun run ci:release:publish

   release-github-publish:
      if: ${{ always() && needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github.result == 'success' &&
         needs.release_npm.result == 'success' }}
      needs: [release_metadata, release_github, release_npm]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - name: Publish verified GitHub Release
           env:
              GH_TOKEN: ${{ github.token }}
           run: gh release edit "${{ needs.release_metadata.outputs.release-tag }}" --repo "${{ github.repository }}" --draft=false

   # Regenerate the Homebrew tap formula (can1357/homebrew-tap) from the freshly
   # published release assets and push it. Gated on release_github so the
   # tap only cuts over to a release whose binaries were smoke-tested in
   # release_binary (matches how release_npm is gated). No-ops when HOMEBREW_TAP_DEPLOY_KEY is unset, so a
   # release never blocks on tap access.
   release_brew:
      name: Update Homebrew tap
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_metadata.outputs.channel != 'canary' &&
         needs.release_github.result == 'success' }}
      needs: [release_metadata, release_github]
      runs-on: ubuntu-22.04
      env:
         HAS_TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           if: env.HAS_TAP_KEY == 'true'
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           if: env.HAS_TAP_KEY == 'true'
         - name: Check out the Homebrew tap
           if: env.HAS_TAP_KEY == 'true'
           uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              repository: can1357/homebrew-tap
              ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
              path: homebrew-tap
         - name: Regenerate and push the formula
           if: env.HAS_TAP_KEY == 'true'
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              bun scripts/ci-update-brew-formula.ts "${{ needs.release_metadata.outputs.release-tag }}" --out homebrew-tap/Formula/omp.rb
              cd homebrew-tap
              if git diff --quiet -- Formula/omp.rb; then
                echo "formula already up to date for ${{ needs.release_metadata.outputs.release-tag }}"
                exit 0
              fi
              git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -m "omp ${{ needs.release_metadata.outputs.release-tag }}" -- Formula/omp.rb
              git push origin HEAD:main
