name: CI

on:
   push:
      branches: [main]
      tags:
         - "v*"
      # Match upstream's source-of-truth CI surface while preserving the fork's
      # vouch-only skip. Path filters do not apply to tag pushes, so releases
      # remain triggered by the v* tag rule above.
      paths:
         - "packages/**"
         - "crates/**"
         - "scripts/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         - ".github/**"
         - "!.github/VOUCHED.td"
   pull_request:
      branches: [main, omp2]
      paths:
         - "packages/**"
         - "crates/**"
         - "scripts/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         - ".github/**"
   workflow_dispatch:
      inputs:
         skip_npm:
            description: "Skip npm publish"
            type: boolean
            default: false

# Tag and manual release runs need a per-SHA, non-cancellable group: a later
# main push must not cancel an in-flight release and leave the tag unpublished
# (#2564). The main push paired atomically with a release tag is only a
# metadata-only companion, so it keeps the normal branch-wide cancellation
# behavior and does not serialize the authoritative tag run.
concurrency:
   group: "${{ github.workflow }}-${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && format('release-{0}', github.sha) || github.ref }}"
   cancel-in-progress: "${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}"

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   # glibc floor for shipped linux native addons. The previous self-hosted runner image was
   # Ubuntu 24.04 (glibc 2.39); a plain native build links 2.39 symbol versions
   # and fails to dlopen on older distros. Building the linux-gnu addons through
   # cargo-zigbuild against this floor keeps them portable. Bump to raise the
   # minimum supported glibc.
   GLIBC_FLOOR: "2.17"
   # audiopus_sys bundles an opus tree whose CMakeLists declares a
   # cmake_minimum_required below 3.5; CMake 4.x refuses to configure it
   # without this override (macOS runner images ship CMake 4).
   CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
   contents: read
   actions: read

jobs:
   # Release jobs are driven by version tag refs (`vX.Y.Z`). The release script
   # pushes the version-bump commit and tag atomically, which creates both a main
   # branch push run and a tag push run. The tag run is authoritative; the
   # companion main run resolves this metadata, then skips duplicate workload.
   release_metadata:
      name: Resolve release metadata
      runs-on: ubuntu-22.04
      outputs:
         is-release: ${{ steps.detect.outputs.is-release }}
         release-tag: ${{ steps.detect.outputs.release-tag }}
         is-companion: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: bump version to ') }}"
         # Canary tags publish to npm's canary dist-tag (derived script-side), mark
         # the GitHub release prerelease, and skip the stable-only brew tap.
         channel: ${{ steps.detect.outputs.channel }}
      steps:
         # Tag refs are the only automatic release trigger. A manual
         # workflow_dispatch also publishes only when dispatched from a valid
         # version tag ref.
         - uses: actions/checkout@v4
           with:
              fetch-tags: false
         - name: Detect release tag
           id: detect
           shell: bash
           run: |
              is_release=false
              release_tag=""
              channel=stable
              case "${{ github.ref }}" in
                refs/tags/v*)
                  if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-canary\.[0-9]+)?$ ]]; then
                    release_tag="${{ github.ref_name }}"
                  else
                    echo "::notice::Ignoring non-semver release tag ${{ github.ref_name }}"
                  fi
                  ;;
              esac
              if [ -n "$release_tag" ]; then
                echo "Release tag $release_tag selected; this run builds and publishes the release."
                is_release=true
              fi
              if [[ "$release_tag" == *-canary.* ]]; then
                channel=canary
              fi
              {
                echo "is-release=$is_release"
                echo "release-tag=$release_tag"
                echo "channel=$channel"
              } >> "$GITHUB_OUTPUT"

   # Compute a stable hash of every input that affects the native cdylib output
   # (scripts/native-source-hash.ts normalizes release version bumps away), then
   # resolve each matching artifact from a trusted push run. A failed or
   # cancelled workflow may still have completed native jobs, so candidates are
   # filtered by event and ancestry rather than overall workflow conclusion.
   native_artifact_lookup:
      name: Look up cached native artifacts
      runs-on: ubuntu-22.04
      needs: [release_metadata]
      if: ${{ needs.release_metadata.outputs.is-companion != 'true' }}
      outputs:
         source-hash: ${{ steps.compute.outputs.source-hash }}
         linux-x64-run-id: ${{ steps.find.outputs.linux-x64-run-id }}
         cross-platform-run-id: ${{ steps.find.outputs.cross-platform-run-id }}
         linux-x64-baseline-run-id: ${{ steps.find.outputs.linux-x64-baseline-run-id }}
         linux-x64-modern-run-id: ${{ steps.find.outputs.linux-x64-modern-run-id }}
         linux-musl-x64-baseline-run-id: ${{ steps.find.outputs.linux-musl-x64-baseline-run-id }}
         darwin-x64-baseline-run-id: ${{ steps.find.outputs.darwin-x64-baseline-run-id }}
         darwin-arm64-run-id: ${{ steps.find.outputs.darwin-arm64-run-id }}
         win32-x64-baseline-run-id: ${{ steps.find.outputs.win32-x64-baseline-run-id }}
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - name: Compute native source hash
           id: compute
           shell: bash
           run: |
              source_hash=$(bun scripts/native-source-hash.ts)
              echo "source-hash=$source_hash" >> "$GITHUB_OUTPUT"
              echo "Native source hash: $source_hash"
         # Query the artifacts API by exact name (8 calls) instead of walking
         # the last 100 runs; this job used to cost ~80s of every run.
         - name: Find trusted push builds with matching native artifacts
           id: find
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              REPO: ${{ github.repository }}
           shell: bash
           run: |
              set -euo pipefail
              hash="${{ steps.compute.outputs.source-hash }}"
              keys=(linux-x64-baseline linux-x64-modern linux-musl-x64-baseline darwin-x64-baseline darwin-arm64 win32-x64-baseline)
              declare -A trusted=()
              # An artifact is trusted only when it came from a CI push run whose
              # exact head SHA is reachable from main.
              is_trusted() {
                local run_id="$1" sha="$2"
                if [ -z "${trusted[$run_id]+x}" ]; then
                  trusted[$run_id]=false
                  local run_meta status
                  run_meta=$(gh api "repos/$REPO/actions/runs/$run_id" --jq '[.event, .path] | @tsv' || true)
                  if [ "$run_meta" = $'push\t.github/workflows/ci.yml' ]; then
                    status=$(gh api "repos/$REPO/compare/$sha...main" --jq .status || true)
                    if [ "$status" = ahead ] || [ "$status" = identical ]; then
                      trusted[$run_id]=true
                    fi
                  fi
                fi
                [ "${trusted[$run_id]}" = true ]
              }
              declare -A run_ids=()
              declare -A run_hits=()
              for key in "${keys[@]}"; do
                run_ids[$key]=""
                while IFS=$'\t' read -r run_id sha; do
                  [ -n "$run_id" ] || continue
                  if is_trusted "$run_id" "$sha"; then
                    [ -n "${run_ids[$key]}" ] || run_ids[$key]="$run_id"
                    run_hits[$run_id]=$(( ${run_hits[$run_id]:-0} + 1 ))
                  fi
                done < <(gh api "repos/$REPO/actions/artifacts?name=pi-natives-${key}-h${hash}&per_page=100" \
                  --jq '.artifacts[] | select(.expired == false) | [.workflow_run.id, .workflow_run.head_sha] | @tsv')
                echo "${key}-run-id=${run_ids[$key]}" >> "$GITHUB_OUTPUT"
                echo "  pi-natives-${key}-h${hash}: ${run_ids[$key]:-rebuild}"
              done
              echo "linux-x64-run-id=${run_ids[linux-x64-baseline]}" >> "$GITHUB_OUTPUT"
              # Same-run completeness canary: skips redundant native jobs on
              # ordinary main pushes when one run already holds the full set.
              cross_platform_run_id=""
              for run_id in "${!run_hits[@]}"; do
                if [ "${run_hits[$run_id]}" -eq "${#keys[@]}" ]; then cross_platform_run_id="$run_id"; break; fi
              done
              echo "cross-platform-run-id=$cross_platform_run_id" >> "$GITHUB_OUTPUT"

   # Fast release path: a release tag is the release-bump commit on top of a
   # main commit that already ran the full test matrix. When the newest main
   # CI run with every test job green is an ancestor of the tag and the diff
   # between them only touches release-bump files, the TS test jobs are
   # skipped for the tag run instead of re-running ~5 minutes of identical
   # tests. Any other diff (or no green base) falls back to the full matrix.
   release_base:
      name: Verify release base passed main CI
      runs-on: ubuntu-22.04
      needs: [release_metadata]
      if: ${{ needs.release_metadata.outputs.is-release == 'true' }}
      timeout-minutes: 5
      outputs:
         tested: ${{ steps.base.outputs.tested }}
      steps:
         - name: Find green main CI base
           id: base
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              REPO: ${{ github.repository }}
           shell: bash
           run: |
              set -euo pipefail
              required=(
                "Lint, type check & web build"
                "Test TS workspace fast"
                "Test coding-agent singleton/global-state (TS)"
                "Test TS native/integration packages"
                "Test coding-agent UI/TUI (TS)"
                "Test coding-agent runtime/session (TS)"
                "Test coding-agent native/unit (TS)"
                "Test CLI smoke (TS)"
                "Install method smoke tests"
              )
              # Files a release bump rewrites (versions, lockfiles, changelogs,
              # native sentinel). Anything else needs a fresh test run.
              allowed='^(package\.json|bun\.lock|Cargo\.toml|Cargo\.lock|CHANGELOG\.md|packages/[^/]+/package\.json|packages/[^/]+/CHANGELOG\.md|crates/pi-natives/src/lib\.rs|packages/natives/native/(index\.js|index\.d\.ts|version-sentinel\.js))$'
              tested=false
              while IFS=$'\t' read -r run_id base_sha; do
                [ -n "$run_id" ] || continue
                status=$(gh api "repos/$REPO/compare/$base_sha...$GITHUB_SHA" --jq .status || true)
                if [ "$status" != ahead ] && [ "$status" != identical ]; then continue; fi
                # Companion bump runs and partial runs skip tests; require every
                # test job of this run (latest attempt) to have passed.
                green=$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
                  --jq '[.jobs[] | select(.conclusion == "success") | .name] | join("\n")')
                missing=0
                for job in "${required[@]}"; do
                  grep -qFx "$job" <<<"$green" || missing=1
                done
                [ "$missing" = 0 ] || continue
                # Newest green ancestor decides; older ones only diverge further.
                # compare caps `files` at 300; a capped list fails the allowlist.
                changed=$(gh api "repos/$REPO/compare/$base_sha...$GITHUB_SHA" \
                  --jq 'if (.files | length) >= 300 then "<truncated file list>" else .files[].filename end')
                echo "Green main CI base: run $run_id at $base_sha"
                if [ -z "$changed" ] || ! grep -vqE "$allowed" <<<"$changed"; then
                  tested=true
                else
                  echo "Diff since base touches non-release files; running the full test matrix:"
                  grep -vE "$allowed" <<<"$changed"
                fi
                break
              done < <(gh run list --repo "$REPO" --workflow=ci.yml --branch=main --event=push --status=completed --limit=30 \
                --json databaseId,headSha --jq '.[] | [.databaseId, .headSha] | @tsv')
              echo "tested=$tested" >> "$GITHUB_OUTPUT"
              echo "Release tests already covered by main CI: $tested"

   # Fast lint, type check, and browser bundle. Tag releases skip this job:
   # the tagged tree already passed on the main push, and a hung `tsgo` here
   # blocked v1.7.9 for 49m after every test had already passed.
   check:
      name: Lint, type check & web build
      runs-on: ubuntu-22.04
      needs: [release_metadata]
      timeout-minutes: 10
      if: ${{ needs.release_metadata.outputs.is-companion != 'true' && needs.release_metadata.outputs.is-release != 'true' }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Verify Rust license compliance (cargo-deny 0.20.2)
           run: |
              install_dir="$(mktemp -d)"
              curl -L --proto '=https' --tlsv1.2 -sSf \
                https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
                | tar -xz -C "$install_dir"
              export PATH="$install_dir/cargo-deny-0.20.2-x86_64-unknown-linux-musl:$PATH"
              cargo deny --locked check licenses sources
         - name: Type check workspace
           run: timeout --kill-after=30s 8m bun run ci:check:full
         - name: Build collab web
           run: bun run collab:web:build
         - name: Build pi-vcs crate
           run: cargo build --locked -p pi-vcs

   # Linux x64 baseline is what TS tests and the default shipped addon need.
   # Modern is a separate AVX2 artifact; a cache miss there must not cancel
   # tests or make download-artifact look for a file that was never uploaded.
   native_linux_x64:
      name: "Native: Linux x64 (baseline)"
      needs: [release_metadata, native_artifact_lookup]
      if: ${{ needs.release_metadata.outputs.is-companion != 'true' && (needs.release_metadata.outputs.is-release == 'true' || needs.native_artifact_lookup.outputs.linux-x64-run-id == '') }}
      runs-on: ubuntu-22.04
      # The upstream v17.3.4 sync adds the `pdf-inspector` crate, so a
      # cold-sccache baseline build no longer fits in 30m (modern needs ~19m).
      timeout-minutes: 50
      steps:
         - uses: actions/checkout@v4
         - name: Download trusted Linux x64 baseline native artifact
           if: ${{ needs.native_artifact_lookup.outputs.linux-x64-baseline-run-id != '' }}
           uses: actions/download-artifact@v4
           with:
              name: pi-natives-linux-x64-baseline-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              run-id: ${{ needs.native_artifact_lookup.outputs.linux-x64-baseline-run-id }}
              github-token: ${{ secrets.GITHUB_TOKEN }}
         - name: Stage Linux x64 baseline native artifact for this run
           if: ${{ needs.native_artifact_lookup.outputs.linux-x64-baseline-run-id != '' }}
           uses: actions/upload-artifact@v4
           with:
              name: pi-natives-linux-x64-baseline-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native/pi_natives.linux-x64*.node
              if-no-files-found: error
         - uses: ./.github/actions/build-native
           if: ${{ needs.native_artifact_lookup.outputs.linux-x64-baseline-run-id == '' }}
           with:
              hash: ${{ needs.native_artifact_lookup.outputs.source-hash }}
              platform: linux
              arch: x64
              variant: baseline
              glibc: ${{ env.GLIBC_FLOOR }}
              rust_checks: "false"
              skip_validation: ${{ needs.release_metadata.outputs.is-release }}
              save_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

   # Rust validation (clippy/rustfmt + the native test suite) runs in its own
   # job, in parallel with the baseline addon build. Serializing ~20 minutes of
   # checks behind the build kept the merge-cold baseline job at ~38m; the two
   # tracks now finish in about the build time. Skip together with the build
   # when the artifact lookup already found validated artifacts.
   native_linux_x64_checks:
      name: "Rust checks & tests (linux x64)"
      needs: [release_metadata, native_artifact_lookup]
      if: ${{ needs.release_metadata.outputs.is-companion != 'true' && (needs.release_metadata.outputs.is-release == 'true' || needs.native_artifact_lookup.outputs.linux-x64-run-id == '') }}
      runs-on: ubuntu-22.04
      timeout-minutes: 40
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/build-native
           if: ${{ needs.native_artifact_lookup.outputs.linux-x64-baseline-run-id == '' }}
           with:
              hash: ${{ needs.native_artifact_lookup.outputs.source-hash }}
              platform: linux
              arch: x64
              variant: baseline
              rust_checks: "true"
              rust_checks_only: "true"
              skip_validation: ${{ needs.release_metadata.outputs.is-release }}

   native_linux_x64_modern:
      name: "Native: Linux x64 (modern)"
      needs: [release_metadata, native_artifact_lookup]
      if: ${{ needs.release_metadata.outputs.is-companion != 'true' && (needs.release_metadata.outputs.is-release == 'true' || needs.native_artifact_lookup.outputs.linux-x64-run-id == '') }}
      runs-on: ubuntu-22.04
      # Same `pdf-inspector` cost as the baseline job; 25m left no headroom.
      timeout-minutes: 40
      steps:
         - uses: actions/checkout@v4
         - name: Download trusted Linux x64 modern native artifact
           if: ${{ needs.native_artifact_lookup.outputs.linux-x64-modern-run-id != '' }}
           uses: actions/download-artifact@v4
           with:
              name: pi-natives-linux-x64-modern-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              run-id: ${{ needs.native_artifact_lookup.outputs.linux-x64-modern-run-id }}
              github-token: ${{ secrets.GITHUB_TOKEN }}
         - name: Stage Linux x64 modern native artifact for this run
           if: ${{ needs.native_artifact_lookup.outputs.linux-x64-modern-run-id != '' }}
           uses: actions/upload-artifact@v4
           with:
              name: pi-natives-linux-x64-modern-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native/pi_natives.linux-x64*.node
              if-no-files-found: error
         - uses: ./.github/actions/build-native
           if: ${{ needs.native_artifact_lookup.outputs.linux-x64-modern-run-id == '' }}
           with:
              hash: ${{ needs.native_artifact_lookup.outputs.source-hash }}
              platform: linux
              arch: x64
              variant: modern
              glibc: ${{ env.GLIBC_FLOOR }}
              skip_validation: ${{ needs.release_metadata.outputs.is-release }}
              save_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}


   # Pre-warm the cross-platform native build cache on `main`, in addition to
   # building the artifacts that ship in releases. Skipped on main when
   # native_artifact_lookup already found a recent run with all artifacts intact.
   native_cross_platform_kata:
      name: "Native: ${{ matrix.platform }} ${{ matrix.libc || '' }} ${{ matrix.arch }}"
      needs: [release_metadata, native_artifact_lookup]
      if: ${{ needs.release_metadata.outputs.is-companion != 'true' && (needs.release_metadata.outputs.is-release == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.native_artifact_lookup.outputs.cross-platform-run-id == '')) }}
      # Cold-cache builds land at 19-20m of the old 25m cap; `pdf-inspector`
      # (added by the v17.3.4 sync) leaves no headroom.
      timeout-minutes: 40
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: ubuntu-22.04, platform: linux, libc: musl, arch: x64, target: x86_64-unknown-linux-musl, variant: baseline }
      runs-on: ${{ matrix.os }}
      steps:
         - uses: actions/checkout@v4
         - name: Download trusted cross-platform native artifact
           if: ${{ needs.native_artifact_lookup.outputs.linux-musl-x64-baseline-run-id != '' }}
           uses: actions/download-artifact@v4
           with:
              name: pi-natives-${{ matrix.platform }}-${{ matrix.libc && format('{0}-', matrix.libc) || '' }}${{ matrix.arch }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              run-id: ${{ needs.native_artifact_lookup.outputs.linux-musl-x64-baseline-run-id }}
              github-token: ${{ secrets.GITHUB_TOKEN }}
         - name: Stage cross-platform native artifact for this run
           if: ${{ needs.native_artifact_lookup.outputs.linux-musl-x64-baseline-run-id != '' }}
           uses: actions/upload-artifact@v4
           with:
              name: pi-natives-${{ matrix.platform }}-${{ matrix.libc && format('{0}-', matrix.libc) || '' }}${{ matrix.arch }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native/pi_natives.${{ matrix.platform }}-${{ matrix.arch }}*.node
              if-no-files-found: error
         - uses: ./.github/actions/build-native
           if: ${{ needs.native_artifact_lookup.outputs.linux-musl-x64-baseline-run-id == '' }}
           with:
              hash: ${{ needs.native_artifact_lookup.outputs.source-hash }}
              platform: ${{ matrix.platform }}
              arch: ${{ matrix.arch }}
              libc: ${{ matrix.libc }}
              variant: ${{ matrix.variant }}
              target: ${{ matrix.target }}
              glibc: ${{ matrix.platform == 'linux' && matrix.libc != 'musl' && env.GLIBC_FLOOR || '' }}
              save_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

   # xwin CRT/SDK first fetch is ~1 GiB and regularly exceeds the 15-minute
   # linux/darwin cap. Cache hits finish faster; the timeout is only the
   # cold-graph ceiling.
   native_cross_platform_win32:
      name: "Native: win32  x64"
      needs: [release_metadata, native_artifact_lookup]
      if: ${{ needs.release_metadata.outputs.is-companion != 'true' && (needs.release_metadata.outputs.is-release == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.native_artifact_lookup.outputs.cross-platform-run-id == '')) }}
      # Same cold-cache headroom as the other cross-platform native jobs.
      timeout-minutes: 40
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - name: Download trusted Windows native artifact
           if: ${{ needs.native_artifact_lookup.outputs.win32-x64-baseline-run-id != '' }}
           uses: actions/download-artifact@v4
           with:
              name: pi-natives-win32-x64-baseline-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              run-id: ${{ needs.native_artifact_lookup.outputs.win32-x64-baseline-run-id }}
              github-token: ${{ secrets.GITHUB_TOKEN }}
         - name: Stage Windows native artifact for this run
           if: ${{ needs.native_artifact_lookup.outputs.win32-x64-baseline-run-id != '' }}
           uses: actions/upload-artifact@v4
           with:
              name: pi-natives-win32-x64-baseline-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native/pi_natives.win32-x64*.node
              if-no-files-found: error
         - uses: ./.github/actions/build-native
           if: ${{ needs.native_artifact_lookup.outputs.win32-x64-baseline-run-id == '' }}
           with:
              hash: ${{ needs.native_artifact_lookup.outputs.source-hash }}
              platform: win32
              arch: x64
              variant: baseline
              target: x86_64-pc-windows-msvc
              save_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

   native_cross_platform_macos:
      name: "Native: ${{ matrix.platform }} ${{ matrix.arch }}"
      needs: [release_metadata, native_artifact_lookup]
      if: ${{ needs.release_metadata.outputs.is-companion != 'true' && (needs.release_metadata.outputs.is-release == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.native_artifact_lookup.outputs.cross-platform-run-id == '')) }}
      # `macos-15-intel` has been hitting the 25m ceiling on main (cancelled at
      # ~25.5m on the last two pushes) while arm64 finishes in ~21m; the
      # `pdf-inspector` crate added by the v17.3.4 sync widens that gap.
      timeout-minutes: 45
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: macos-15-intel, platform: darwin, arch: x64, variant: baseline }
               - { os: macos-14, platform: darwin, arch: arm64 }
      # Reusing a trusted artifact only downloads and re-uploads it; do that on
      # a Linux runner instead of waiting for a macOS machine.
      runs-on: ${{ ((matrix.arch == 'x64' && needs.native_artifact_lookup.outputs.darwin-x64-baseline-run-id != '') || (matrix.arch == 'arm64' && needs.native_artifact_lookup.outputs.darwin-arm64-run-id != '')) && 'ubuntu-22.04' || matrix.os }}
      steps:
         - uses: actions/checkout@v4
         - name: Download trusted macOS native artifact
           if: ${{ (matrix.arch == 'x64' && needs.native_artifact_lookup.outputs.darwin-x64-baseline-run-id != '') || (matrix.arch == 'arm64' && needs.native_artifact_lookup.outputs.darwin-arm64-run-id != '') }}
           uses: actions/download-artifact@v4
           with:
              name: pi-natives-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              run-id: ${{ matrix.arch == 'x64' && needs.native_artifact_lookup.outputs.darwin-x64-baseline-run-id || needs.native_artifact_lookup.outputs.darwin-arm64-run-id }}
              github-token: ${{ secrets.GITHUB_TOKEN }}
         - name: Stage macOS native artifact for this run
           if: ${{ (matrix.arch == 'x64' && needs.native_artifact_lookup.outputs.darwin-x64-baseline-run-id != '') || (matrix.arch == 'arm64' && needs.native_artifact_lookup.outputs.darwin-arm64-run-id != '') }}
           uses: actions/upload-artifact@v4
           with:
              name: pi-natives-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native/pi_natives.${{ matrix.platform }}-${{ matrix.arch }}*.node
              if-no-files-found: error
         - uses: ./.github/actions/build-native
           if: ${{ (matrix.arch == 'x64' && needs.native_artifact_lookup.outputs.darwin-x64-baseline-run-id == '') || (matrix.arch == 'arm64' && needs.native_artifact_lookup.outputs.darwin-arm64-run-id == '') }}
           with:
              hash: ${{ needs.native_artifact_lookup.outputs.source-hash }}
              platform: ${{ matrix.platform }}
              arch: ${{ matrix.arch }}
              variant: ${{ matrix.variant }}
              target: ${{ matrix.target }}
              save_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
   test_workspace:
      name: Test TS workspace fast
      runs-on: ubuntu-22.04
      needs: [release_metadata, release_base, native_linux_x64, native_artifact_lookup]
      if: ${{ needs.release_metadata.outputs.is-companion != 'true' && !cancelled() && needs.native_linux_x64.result != 'failure' && needs.release_base.outputs.tested != 'true' }}
